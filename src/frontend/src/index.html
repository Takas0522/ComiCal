<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>まんがリマインダー | ComiCal</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
  <!--
    Runtime configuration injected by Static Web Apps. The SWA build step
    replaces ${AI_CONNECTION_STRING} with the value of the
    APPLICATIONINSIGHTS_CONNECTION_STRING app setting (sourced from Key Vault
    via Managed Identity — see infra/modules/app.bicep). The connection
    string is non-secret for browser instrumentation (public-by-design).
    Locally __env__ stays empty, which the AppInsights service treats as
    "telemetry disabled" — expected behaviour during dev.
  -->
  <script>
    window.__env__ = {
      aiConnectionString: "${AI_CONNECTION_STRING}".startsWith("$") ? "" : "${AI_CONNECTION_STRING}"
    };
  </script>
  <app-root></app-root>
</body>
</html>
