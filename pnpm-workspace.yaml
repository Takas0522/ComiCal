packages:
  - "src/frontend"
  - "src/tests/e2e"
# サプライチェーン攻撃対策: 公開直後（乗っ取り・不正パッケージが出回りやすい期間）の
# バージョンは pnpm install/add 実行時点でインストールをブロックする。
# Dependabot の cooldown（.github/dependabot.yml）は自動PR作成のみを制御するため、
# 開発者や AI エージェントによる手動の `pnpm add`/`pnpm install` を保護できない。
# minimumReleaseAge はその隙間を埋め、CLI 実行そのものを制御する（単位: 分）。
minimumReleaseAge: 10080 # 7日 = 60*24*7
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: true
allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  libxmljs2: true
  lmdb: true
  msgpackr-extract: true
  unrs-resolver: true
overrides:
  'uuid@<14.0.0': ^14.0.0
  libxmljs2: '-'
  'postcss@<8.5.18': ^8.5.18
  'webpack-dev-server@<5.2.6': ^5.2.6
  '@babel/core@<7.29.6': ^7.29.6
  'launch-editor@<2.14.1': ^2.14.1
  'http-proxy-middleware@<2.0.10': ^2.0.10
  'immutable@<5.1.8': ^5.1.8
  'ws@<8.21.0': ^8.21.0
  'tar@<7.5.21': ^7.5.21
  'brace-expansion@<1.1.16': ^1.1.16
  'brace-expansion@>=2.0.0 <2.1.3': ^2.1.3
  'brace-expansion@>=3.0.0 <5.0.7': ^5.0.7
  'shell-quote@<1.9.0': ^1.9.0
  'js-yaml@<3.15.0': ^3.15.0
  'js-yaml@>=4.0.0 <4.3.0': ^4.3.0
  'sigstore@<4.1.1': ^4.1.1
  '@sigstore/verify@<3.1.1': ^3.1.1
  '@sigstore/core@<3.2.1': ^3.2.1
  'websocket-driver@<0.7.5': ^0.7.5
  'fast-uri@<3.1.4': ^3.1.4
ignoredOptionalDependencies:
  - libxmljs2
