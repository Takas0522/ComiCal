name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read
  pull-requests: write

jobs:
  build-and-deploy:
    if: github.event.action != 'closed'
    name: Build and Deploy Preview
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@fe02b74b709e93a0fd4afbcfdfb32aa7e7a8b245 # v4.0.0
        with:
          version: '10'
      - uses: actions/setup-node@1d0ff469b65b52b3a2f85e3b56f33f4e9bdf9a36 # v4.2.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - uses: actions/setup-dotnet@67a3573d9ce0b7f12f1c9a89c49218e6ff7fa02f # v4.3.1
        with:
          global-json-file: global.json
      - name: Install frontend dependencies
        run: pnpm --filter frontend install --frozen-lockfile
      - name: Build frontend
        run: pnpm --filter frontend build
      - name: Build backend API
        run: dotnet publish src/backend/api/ComiCal.Api/ComiCal.Api.csproj -c Release -o dist/api
      - name: Deploy to SWA Preview
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_DEPLOY_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "src/frontend"
          api_location: ""
          output_location: "dist/frontend/browser"

  close-preview:
    if: github.event.action == 'closed'
    name: Close Preview
    runs-on: ubuntu-latest
    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_DEPLOY_TOKEN }}
          action: "close"
