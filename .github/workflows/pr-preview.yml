name: PR Preview (SWA)

# Stage Z: SWA Standard の Preview Environment を PR ごとに自動生成。
# - フォーク PR は対象外（fork からは secrets が読めず、検証目的でも不可）
# - Backend Functions と DB は dev と共有（コスト最適化、トレードオフは
#   docs/runbooks/preview-environments.md を参照）
# - PR close で Preview を自動破棄し、PR コメントで URL を通知

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  PNPM_VERSION: '9.15.4'

jobs:
  preview:
    name: Build & deploy SWA preview
    # Same-repo PR のみ。fork PR では secrets / OIDC が使えないため除外。
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    environment: dev
    outputs:
      preview_url: ${{ steps.deploy.outputs.static_web_app_url }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          submodules: false
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - if: github.event.action != 'closed'
        run: pnpm install --frozen-lockfile
      - if: github.event.action != 'closed'
        run: pnpm --filter frontend build
      - uses: azure/login@a65d910e8af852a8061c627c456678983e180302 # v2.2.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - id: token
        name: Resolve dev SWA deployment token
        env:
          RG: ${{ vars.AZURE_RESOURCE_GROUP_DEV }}
          SWA: ${{ vars.AZURE_STATIC_WEB_APP_DEV }}
        run: |
          set -euo pipefail
          : "${RG:?vars.AZURE_RESOURCE_GROUP_DEV missing}"
          : "${SWA:?vars.AZURE_STATIC_WEB_APP_DEV missing}"
          TOKEN=$(az staticwebapp secrets list -g "${RG}" -n "${SWA}" --query 'properties.apiKey' -o tsv)
          echo "::add-mask::${TOKEN}"
          echo "swa_token=${TOKEN}" >> "$GITHUB_OUTPUT"
      - id: deploy
        name: Deploy SWA preview environment
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ steps.token.outputs.swa_token }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: ${{ github.event.action == 'closed' && 'close' || 'upload' }}
          app_location: 'src/frontend'
          output_location: 'dist/frontend/browser'
          skip_app_build: true
          deployment_environment: pr-${{ github.event.pull_request.number }}
          production_branch: main
      - name: Comment preview URL on PR
        if: github.event.action != 'closed' && steps.deploy.outputs.static_web_app_url != ''
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const url = '${{ steps.deploy.outputs.static_web_app_url }}';
            const marker = '<!-- comical-pr-preview -->';
            const body = `${marker}\n` +
              `🔍 **Preview deployed**: <${url}>\n\n` +
              `> ⚠️ Backend API / DB は **dev 環境と共有**しています。\n` +
              `> 詳細: \`docs/runbooks/preview-environments.md\``;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(c => (c.body || '').includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
      - name: Comment teardown notice on PR close
        if: github.event.action == 'closed'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const marker = '<!-- comical-pr-preview -->';
            const body = `${marker}\n🧹 Preview environment for PR #${context.issue.number} has been torn down.`;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(c => (c.body || '').includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            }
