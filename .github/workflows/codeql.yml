name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 18 * * 1'  # 毎週月曜 03:00 JST

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            build-mode: none
          - language: csharp
            build-mode: manual
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Initialize CodeQL
        uses: github/codeql-action/init@0317bd866e2a5371dd9827110664107b306af4a8 # v3.28.5
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - if: matrix.build-mode == 'manual'
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json
      - if: matrix.build-mode == 'manual'
        run: dotnet build src/backend/ComiCal.slnx
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@0317bd866e2a5371dd9827110664107b306af4a8 # v3.28.5
        with:
          category: "/language:${{ matrix.language }}"
