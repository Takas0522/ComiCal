name: SBOM

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  id-token: read

concurrency:
  group: sbom-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '22'
  DOTNET_VERSION: '10.0.100'
  PNPM_VERSION: '9.15.4'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  generate-sbom:
    name: Generate CycloneDX SBOM (backend + frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-dotnet@87b7050bc53ea08284295505d98d2aa94301e852 # v4.2.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: Cache NuGet packages
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', '**/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Prepare output directory
        run: mkdir -p sbom

      - name: Install pnpm dependencies (workspace)
        run: pnpm install --frozen-lockfile

      - name: Restore .NET solution
        run: dotnet restore src/backend/ComiCal.sln

      - name: Install CycloneDX .NET tool
        run: dotnet tool install --global CycloneDX

      - name: Ensure dotnet tools on PATH
        run: echo "${HOME}/.dotnet/tools" >> "${GITHUB_PATH}"

      - name: Generate backend SBOM (CycloneDX)
        run: |
          dotnet CycloneDX src/backend/ComiCal.sln \
            -o sbom \
            -f sbom-backend.cdx.json \
            --json

      - name: Generate frontend SBOM (CycloneDX)
        run: |
          npx --yes @cyclonedx/cyclonedx-npm \
            --output-format JSON \
            --output-file sbom/sbom-frontend.cdx.json \
            src/frontend

      - name: Generate e2e SBOM (CycloneDX)
        run: |
          npx --yes @cyclonedx/cyclonedx-npm \
            --output-format JSON \
            --output-file sbom/sbom-e2e.cdx.json \
            src/tests/e2e

      - name: Generate consolidated OSS report (JSON)
        run: bash tools/oss-report/generate-oss-report.sh sbom sbom/oss-report.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: sbom-cyclonedx
          path: sbom/
          if-no-files-found: error
          retention-days: 90

      - name: Attach SBOM to GitHub Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "${RELEASE_TAG}" \
            sbom/sbom-backend.cdx.json \
            sbom/sbom-frontend.cdx.json \
            sbom/sbom-e2e.cdx.json \
            sbom/oss-report.json \
            --clobber
