name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: '22'
  DOTNET_VERSION: '10.0.100'
  PNPM_VERSION: '9.15.4'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  lint-frontend:
    name: Lint (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint frontend
        run: pnpm --filter frontend lint

  test-frontend:
    name: Test (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run Jest with coverage
        run: pnpm --filter frontend test --coverage
      - name: Upload frontend coverage
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: frontend-coverage
          path: src/frontend/coverage
          if-no-files-found: ignore
          retention-days: 7

  build-frontend:
    name: Build (frontend SSR)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build frontend (SSR)
        run: pnpm --filter frontend build
      - name: Build e2e package (no test run)
        run: pnpm --filter e2e install --frozen-lockfile
      - name: Upload frontend dist
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: frontend-dist
          path: src/frontend/dist
          if-no-files-found: warn
          retention-days: 7

  format-backend:
    name: Format (backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@87b7050bc53ea08284295505d98d2aa94301e852 # v4.2.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Cache NuGet packages
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', '**/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: Restore
        run: dotnet restore src/backend/ComiCal.sln
      - name: Verify formatting
        run: dotnet format src/backend/ComiCal.sln --verify-no-changes

  build-backend:
    name: Build (backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@87b7050bc53ea08284295505d98d2aa94301e852 # v4.2.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Cache NuGet packages
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', '**/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: Restore
        run: dotnet restore src/backend/ComiCal.sln
      - name: Build (warnaserror)
        run: dotnet build src/backend/ComiCal.sln -warnaserror --nologo --no-restore -c Release

  build-db:
    name: Build (DB DACPAC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@87b7050bc53ea08284295505d98d2aa94301e852 # v4.2.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Cache NuGet packages
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/.nuget/packages
          key: nuget-db-${{ runner.os }}-${{ hashFiles('src/db/**/*.sqlproj', 'src/db/**/*.props') }}
          restore-keys: |
            nuget-db-${{ runner.os }}-
      - name: Build SQL project
        run: dotnet build src/db/ComiCal.Database.sqlproj --nologo -c Release
      - name: Upload DACPAC
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: comical-database-dacpac
          path: src/db/**/bin/Release/*.dacpac
          if-no-files-found: error
          retention-days: 14

  test-backend-unit:
    name: Test (backend unit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@87b7050bc53ea08284295505d98d2aa94301e852 # v4.2.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Cache NuGet packages
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', '**/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: Restore
        run: dotnet restore src/tests/backend/ComiCal.Tests.Backend.sln
      - name: Run unit tests
        run: |
          dotnet test src/tests/backend/ComiCal.Tests.Backend.sln \
            --no-restore \
            --filter Category!=Integration \
            --collect:"XPlat Code Coverage" \
            --settings src/tests/backend/coverage.runsettings \
            --results-directory ./coverage-backend-unit \
            --logger "trx;LogFileName=unit.trx"
      - name: Upload unit-test coverage
        if: always()
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: backend-unit-coverage
          path: coverage-backend-unit
          if-no-files-found: ignore
          retention-days: 7

  test-backend-integration:
    name: Test (backend integration)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@87b7050bc53ea08284295505d98d2aa94301e852 # v4.2.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Cache NuGet packages
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', '**/packages.lock.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-
      - name: Verify Docker available (Testcontainers)
        run: docker version
      - name: Restore
        run: dotnet restore src/tests/backend/ComiCal.Tests.Backend.sln
      - name: Run integration tests
        run: |
          dotnet test src/tests/backend/ComiCal.Tests.Backend.sln \
            --no-restore \
            --filter Category=Integration \
            --collect:"XPlat Code Coverage" \
            --settings src/tests/backend/coverage.runsettings \
            --results-directory ./coverage-backend-integration \
            --logger "trx;LogFileName=integration.trx"
      - name: Upload integration-test coverage
        if: always()
        uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: backend-integration-coverage
          path: coverage-backend-integration
          if-no-files-found: ignore
          retention-days: 7

  bicep-lint:
    name: Bicep build (lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Detect infra changes
        id: changes
        uses: dorny/paths-filter@de90cc6fb38fc0963ad72b210f1f284cd68cea36 # v3.0.2
        with:
          filters: |
            infra:
              - 'infra/**'
              - '.github/workflows/ci.yml'
      - name: Install Bicep CLI
        if: steps.changes.outputs.infra == 'true'
        run: |
          curl -sLo bicep https://github.com/Azure/bicep/releases/download/v0.32.4/bicep-linux-x64
          chmod +x bicep
          sudo mv bicep /usr/local/bin/bicep
          bicep --version
      - name: bicep build (main + modules)
        if: steps.changes.outputs.infra == 'true'
        run: |
          set -e
          bicep build infra/main.bicep
          for f in infra/modules/*.bicep; do
            echo "::group::bicep build $f"
            bicep build "$f"
            echo "::endgroup::"
          done
      - name: bicep build-params (dev/prod)
        if: steps.changes.outputs.infra == 'true'
        run: |
          set -e
          for p in infra/params/*.bicepparam; do
            echo "::group::bicep build-params $p"
            bicep build-params "$p" --stdout > /dev/null
            echo "::endgroup::"
          done

  bicep-whatif:
    name: Bicep what-if (${{ matrix.env }})
    runs-on: ubuntu-latest
    if: ${{ vars.AZURE_TENANT_ID != '' }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        env: [dev, prod]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Azure login (OIDC)
        uses: azure/login@a65d910e8af852a8061c627c456678983e180302 # v2.2.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Bicep build
        uses: azure/cli@089eac9d8cc39f5d003e94f8b65efc51076c9cbd # v2.1.0
        with:
          inlineScript: |
            az bicep build --file infra/main.bicep
      - name: Bicep what-if (${{ matrix.env }})
        uses: azure/cli@089eac9d8cc39f5d003e94f8b65efc51076c9cbd # v2.1.0
        with:
          inlineScript: |
            az deployment sub what-if \
              -l japaneast \
              -f infra/main.bicep \
              -p infra/params/${{ matrix.env }}.bicepparam

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [csharp, javascript-typescript]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@87b7050bc53ea08284295505d98d2aa94301e852 # v4.2.0
        if: matrix.language == 'csharp'
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        if: matrix.language == 'javascript-typescript'
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        if: matrix.language == 'javascript-typescript'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - name: Initialize CodeQL
        uses: github/codeql-action/init@f09c1c0a94de965c15400f5634aa42fac8fb8f88 # v3.27.5
        with:
          languages: ${{ matrix.language }}
      - name: Build for CodeQL (.NET)
        if: matrix.language == 'csharp'
        run: dotnet build src/backend/ComiCal.sln --nologo -c Release
      - name: Install JS dependencies for CodeQL
        if: matrix.language == 'javascript-typescript'
        run: pnpm install --frozen-lockfile
      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@f09c1c0a94de965c15400f5634aa42fac8fb8f88 # v3.27.5
        with:
          category: "/language:${{ matrix.language }}"
