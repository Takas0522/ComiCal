name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  lint-frontend:
    name: Lint Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@fe02b74b709e93a0fd4afbcfdfb32aa7e7a8b245 # v4.0.0
        with:
          version: '10'
      - uses: actions/setup-node@1d0ff469b65b52b3a2f85e3b56f33f4e9bdf9a36 # v4.2.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
          cache-dependency-path: 'src/frontend/pnpm-lock.yaml'
      - name: Install dependencies
        run: pnpm --filter frontend install --frozen-lockfile
      - name: Lint
        run: pnpm --filter frontend lint

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@fe02b74b709e93a0fd4afbcfdfb32aa7e7a8b245 # v4.0.0
        with:
          version: '10'
      - uses: actions/setup-node@1d0ff469b65b52b3a2f85e3b56f33f4e9bdf9a36 # v4.2.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm --filter frontend install --frozen-lockfile
      - name: Test
        run: pnpm --filter frontend test -- --ci --coverage
      - name: Upload coverage
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: frontend-coverage
          path: src/frontend/coverage/

  build-frontend:
    name: Build Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: pnpm/action-setup@fe02b74b709e93a0fd4afbcfdfb32aa7e7a8b245 # v4.0.0
        with:
          version: '10'
      - uses: actions/setup-node@1d0ff469b65b52b3a2f85e3b56f33f4e9bdf9a36 # v4.2.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm --filter frontend install --frozen-lockfile
      - name: Build
        run: pnpm --filter frontend build

  lint-backend:
    name: Lint Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@67a3573d9ce0b7f12f1c9a89c49218e6ff7fa02f # v4.3.1
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore src/backend/ComiCal.slnx
      - name: Format check
        run: dotnet format src/backend/ComiCal.slnx --verify-no-changes

  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: TestPassword123!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P TestPassword123! -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@67a3573d9ce0b7f12f1c9a89c49218e6ff7fa02f # v4.3.1
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore src/backend/ComiCal.slnx
      - name: Build
        run: dotnet build src/backend/ComiCal.slnx --no-restore
      - name: Test
        run: >
          dotnet test src/backend/ComiCal.slnx --no-build
          --collect:"XPlat Code Coverage"
          --results-directory TestResults/
      - name: Upload coverage
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: backend-coverage
          path: TestResults/

  build-db:
    name: Build DB (SSDT)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@67a3573d9ce0b7f12f1c9a89c49218e6ff7fa02f # v4.3.1
        with:
          global-json-file: global.json
      - name: Build DACPAC
        run: dotnet build src/db/ComiCal.Database.sqlproj
