name: CD - Dev

on:
  push:
    branches: [main, feature/fix-cd]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Manual run reason'
        required: false
        default: 'manual'

permissions:
  contents: read
  id-token: write # Required for OIDC

jobs:
  deploy-dev:
    name: Deploy to Dev
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: deploy-dev
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup .NET
        uses: actions/setup-dotnet@3e891b0cb619bf60e2c25674b222b8940e2c1c25 # v4.1.0
        with:
          global-json-file: global.json

      - name: Setup Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: '10'
          run_install: false

      - name: Azure Login (OIDC)
        uses: azure/login@eec3c95657c1536435858eda1f3ff5437fee8474 # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Bicep What-If
        env:
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
        run: |
          az deployment sub what-if \
            --location japaneast \
            --template-file infra/main.bicep \
            --parameters infra/params/dev.bicepparam

      - name: Bicep Deploy
        env:
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
        run: |
          az deployment sub create \
            --location japaneast \
            --template-file infra/main.bicep \
            --parameters infra/params/dev.bicepparam \
            --name "deploy-dev-${{ github.run_number }}"

      - name: Get deployment outputs
        id: outputs
        run: |
          DEPLOY_NAME="deploy-dev-${{ github.run_number }}"
          SQL_FQDN=$(az deployment sub show --name "$DEPLOY_NAME" --query "properties.outputs.sqlServerFqdn.value" -o tsv)
          SQL_DB=$(az deployment sub show --name "$DEPLOY_NAME" --query "properties.outputs.sqlDatabaseName.value" -o tsv)
          API_APP=$(az deployment sub show --name "$DEPLOY_NAME" --query "properties.outputs.funcApiName.value" -o tsv)
          BATCH_APP=$(az deployment sub show --name "$DEPLOY_NAME" --query "properties.outputs.funcBatchName.value" -o tsv)
          RG=$(az deployment sub show --name "$DEPLOY_NAME" --query "properties.outputs.resourceGroupName.value" -o tsv)
          echo "sqlFqdn=$SQL_FQDN" >> $GITHUB_OUTPUT
          echo "sqlDb=$SQL_DB" >> $GITHUB_OUTPUT
          echo "apiApp=$API_APP" >> $GITHUB_OUTPUT
          echo "batchApp=$BATCH_APP" >> $GITHUB_OUTPUT
          echo "rg=$RG" >> $GITHUB_OUTPUT

      - name: DB Publish (sqlpackage)
        run: |
          dotnet tool install --global microsoft.sqlpackage || true
          dotnet build src/db/ComiCal.Database.sqlproj --configuration Release
          ACCESS_TOKEN=$(az account get-access-token --resource https://database.windows.net --query accessToken -o tsv)
          echo "::add-mask::$ACCESS_TOKEN"
          sqlpackage /Action:Publish \
            /SourceFile:"src/db/bin/Release/ComiCal.Database.dacpac" \
            /TargetServerName:"${{ steps.outputs.outputs.sqlFqdn }}" \
            /TargetDatabaseName:"${{ steps.outputs.outputs.sqlDb }}" \
            /AccessToken:"$ACCESS_TOKEN" \
            /p:BlockOnPossibleDataLoss=true

      - name: Build Backend
        run: dotnet build src/backend/ComiCal.slnx --configuration Release --no-restore

      - name: Publish API Functions
        run: |
          dotnet publish src/backend/api/ComiCal.Api/ComiCal.Api.csproj \
            --configuration Release --output ./publish/api
          cd publish/api && zip -r ../../api.zip .

      - name: Publish Batch Functions
        run: |
          dotnet publish src/backend/batch/ComiCal.Batch/ComiCal.Batch.csproj \
            --configuration Release --output ./publish/batch
          cd publish/batch && zip -r ../../batch.zip .

      - name: Deploy API to Azure Functions
        run: |
          az functionapp deployment source config-zip \
            --resource-group "${{ steps.outputs.outputs.rg }}" \
            --name "${{ steps.outputs.outputs.apiApp }}" \
            --src api.zip

      - name: Deploy Batch to Azure Functions
        run: |
          az functionapp deployment source config-zip \
            --resource-group "${{ steps.outputs.outputs.rg }}" \
            --name "${{ steps.outputs.outputs.batchApp }}" \
            --src batch.zip

      - name: Build Frontend
        run: |
          pnpm install
          pnpm --filter frontend build
          cp src/frontend/dist/frontend/browser/index.csr.html src/frontend/dist/frontend/browser/index.html
          cp staticwebapp.config.json src/frontend/dist/frontend/browser/staticwebapp.config.json

      - name: Deploy Frontend to SWA
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_DEPLOY_TOKEN }}
          action: upload
          app_location: src/frontend/dist/frontend/browser
          output_location: ""
          skip_app_build: true
