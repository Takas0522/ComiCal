name: CD - Dev

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      reason:
        description: 'Manual run reason'
        required: false
        default: 'manual'

permissions:
  contents: read
  id-token: write # Required for OIDC

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      db: ${{ steps.filter.outputs.db }}
      infra: ${{ steps.filter.outputs.infra }}
      workflows: ${{ steps.filter.outputs.workflows }}
      deploy_config: ${{ steps.filter.outputs.deploy_config }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: filter
        with:
          filters: |
            frontend:
              - 'src/frontend/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.nvmrc'
              - 'staticwebapp.config.json'
            backend:
              - 'src/backend/**'
              - 'global.json'
            db:
              - 'src/db/**'
            infra:
              - 'infra/**'
            workflows:
              - '.github/workflows/cd-dev.yml'
            deploy_config:
              - 'staticwebapp.config.json'

  deploy-dev:
    name: Deploy to Dev
    needs: changes
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    env:
      RUN_INFRA: ${{ needs.changes.outputs.infra == 'true' || needs.changes.outputs.workflows == 'true' || github.event_name == 'workflow_dispatch' }}
      RUN_DB: ${{ needs.changes.outputs.db == 'true' || needs.changes.outputs.workflows == 'true' || github.event_name == 'workflow_dispatch' }}
      RUN_BACKEND: ${{ needs.changes.outputs.backend == 'true' || needs.changes.outputs.workflows == 'true' || github.event_name == 'workflow_dispatch' }}
      RUN_FRONTEND: ${{ needs.changes.outputs.frontend == 'true' || needs.changes.outputs.workflows == 'true' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit
      - name: Show what will run
        run: |
          echo "infra=$RUN_INFRA"
          echo "db=$RUN_DB"
          echo "backend=$RUN_BACKEND"
          echo "frontend=$RUN_FRONTEND"

      - name: Skip entire deploy (no relevant changes)
        if: env.RUN_INFRA != 'true' && env.RUN_DB != 'true' && env.RUN_BACKEND != 'true' && env.RUN_FRONTEND != 'true'
        run: |
          echo "::notice::No infra/db/backend/frontend changes detected. Skipping deploy."
          exit 0

      - name: Checkout
        if: env.RUN_INFRA == 'true' || env.RUN_DB == 'true' || env.RUN_BACKEND == 'true' || env.RUN_FRONTEND == 'true'
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup .NET
        if: env.RUN_DB == 'true' || env.RUN_BACKEND == 'true'
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          global-json-file: global.json

      - name: Setup Node.js
        if: env.RUN_FRONTEND == 'true'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        if: env.RUN_FRONTEND == 'true'
        uses: pnpm/action-setup@91ab88e2619ed1f46221f0ba42d1492c02baf788 # v6.0.6
        with:
          version: '10'
          run_install: false

      - name: Azure Login (OIDC)
        if: env.RUN_INFRA == 'true' || env.RUN_DB == 'true' || env.RUN_BACKEND == 'true'
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Bicep What-If
        if: env.RUN_INFRA == 'true'
        env:
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
          RAKUTEN_APPLICATION_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
        run: |
          az deployment sub what-if \
            --location japaneast \
            --template-file infra/main.bicep \
            --parameters infra/params/dev.bicepparam

      - name: Bicep Deploy
        if: env.RUN_INFRA == 'true'
        env:
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
          RAKUTEN_APPLICATION_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
        run: |
          az deployment sub create \
            --location japaneast \
            --template-file infra/main.bicep \
            --parameters infra/params/dev.bicepparam \
            --name "deploy-dev-${{ github.run_number }}"

      - name: Get deployment outputs
        id: outputs
        if: env.RUN_INFRA == 'true' || env.RUN_DB == 'true' || env.RUN_BACKEND == 'true'
        run: |
          if [ "$RUN_INFRA" = "true" ]; then
            DEPLOY_NAME="deploy-dev-${{ github.run_number }}"
          else
            # Reuse outputs from the most recent successful Bicep deployment
            DEPLOY_NAME=$(az deployment sub list \
              --query "sort_by([?starts_with(name, 'deploy-dev-') && properties.provisioningState=='Succeeded'], &properties.timestamp)[-1].name" \
              -o tsv)
            if [ -z "$DEPLOY_NAME" ]; then
              echo "::error::No prior successful deploy-dev-* deployment found and infra step was skipped."
              exit 1
            fi
            echo "Using prior deployment: $DEPLOY_NAME"
          fi
          SQL_FQDN=$(az deployment sub show --name "$DEPLOY_NAME" --query "properties.outputs.sqlServerFqdn.value" -o tsv)
          SQL_DB=$(az deployment sub show --name "$DEPLOY_NAME" --query "properties.outputs.sqlDatabaseName.value" -o tsv)
          API_APP=$(az deployment sub show --name "$DEPLOY_NAME" --query "properties.outputs.funcApiName.value" -o tsv)
          BATCH_APP=$(az deployment sub show --name "$DEPLOY_NAME" --query "properties.outputs.funcBatchName.value" -o tsv)
          RG=$(az deployment sub show --name "$DEPLOY_NAME" --query "properties.outputs.resourceGroupName.value" -o tsv)
          echo "sqlFqdn=$SQL_FQDN" >> $GITHUB_OUTPUT
          echo "sqlDb=$SQL_DB" >> $GITHUB_OUTPUT
          echo "apiApp=$API_APP" >> $GITHUB_OUTPUT
          echo "batchApp=$BATCH_APP" >> $GITHUB_OUTPUT
          echo "rg=$RG" >> $GITHUB_OUTPUT

      - name: Set SQL Server Entra admin
        # Idempotent. Required so the deploying SP can later issue
        # CREATE USER FROM EXTERNAL PROVIDER against the database.
        # Done via az CLI (not Bicep) because the inline 'administrators'
        # block on Microsoft.Sql/servers conflicts on existing servers.
        if: env.RUN_INFRA == 'true' || env.RUN_DB == 'true' || env.RUN_BACKEND == 'true'
        run: |
          set -euo pipefail
          RG='${{ steps.outputs.outputs.rg }}'
          SQL_FQDN='${{ steps.outputs.outputs.sqlFqdn }}'
          SQL_SERVER="${SQL_FQDN%%.*}"
          az sql server ad-admin create \
            --resource-group "$RG" \
            --server "$SQL_SERVER" \
            --display-name 'comical-github-oidc' \
            --object-id '${{ vars.AZURE_CLIENT_OBJECT_ID }}' \
            -o none

      - name: DB Publish (sqlpackage)
        if: env.RUN_DB == 'true'
        env:
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
        run: |
          dotnet tool install --global microsoft.sqlpackage || true
          dotnet build src/db/ComiCal.Database.sqlproj --configuration Release
          sqlpackage /Action:Publish \
            /SourceFile:"src/db/bin/Release/ComiCal.Database.dacpac" \
            /TargetServerName:"${{ steps.outputs.outputs.sqlFqdn }}" \
            /TargetDatabaseName:"${{ steps.outputs.outputs.sqlDb }}" \
            /TargetUser:"sqladmin" \
            /TargetPassword:"$SQL_ADMIN_PASSWORD" \
            /TargetEncryptConnection:True \
            /p:BlockOnPossibleDataLoss=true

      - name: Grant Function MIs DB access
        # Idempotently CREATE USER FROM EXTERNAL PROVIDER (via SID) and grant
        # db_datareader / db_datawriter to the API and Batch Function App MIs.
        # Runs whenever infra/db/backend changed (any of which may add/rotate the MIs or DB).
        if: env.RUN_INFRA == 'true' || env.RUN_DB == 'true' || env.RUN_BACKEND == 'true'
        run: |
          set -euo pipefail
          # Install go-sqlcmd (single static binary; uses az CLI session for AAD auth)
          curl -sSL -o /tmp/sqlcmd.tar.bz2 \
            https://github.com/microsoft/go-sqlcmd/releases/download/v1.8.0/sqlcmd-linux-amd64.tar.bz2
          mkdir -p /tmp/sqlcmd && tar -xjf /tmp/sqlcmd.tar.bz2 -C /tmp/sqlcmd
          SQLCMD=/tmp/sqlcmd/sqlcmd

          RG='${{ steps.outputs.outputs.rg }}'
          API_APP='${{ steps.outputs.outputs.apiApp }}'
          BATCH_APP='${{ steps.outputs.outputs.batchApp }}'
          SQL_FQDN='${{ steps.outputs.outputs.sqlFqdn }}'
          SQL_DB='${{ steps.outputs.outputs.sqlDb }}'

          # For Service Principals (Managed Identity included), Azure SQL
          # expects the database user SID to be derived from the AAD
          # *application ID* (appId) — NOT the principal/object ID.
          # If we use the objectId, CREATE USER succeeds but the MI's
          # token is rejected at login as "<token-identified principal>".
          API_PID=$(az functionapp identity show -g "$RG" -n "$API_APP" --query principalId -o tsv)
          BATCH_PID=$(az functionapp identity show -g "$RG" -n "$BATCH_APP" --query principalId -o tsv)
          API_APPID=$(az ad sp show --id "$API_PID" --query appId -o tsv)
          BATCH_APPID=$(az ad sp show --id "$BATCH_PID" --query appId -o tsv)

          if [ -z "$API_APPID" ] || [ -z "$BATCH_APPID" ]; then
            echo "Failed to resolve appId for one or both Function App MIs." >&2
            echo "API_APPID=$API_APPID BATCH_APPID=$BATCH_APPID" >&2
            exit 1
          fi

          cat > /tmp/grant.sql <<SQL
          SET NOCOUNT ON;
          DECLARE @apiName    sysname          = N'$API_APP';
          DECLARE @apiAppId   uniqueidentifier = N'$API_APPID';
          DECLARE @bchName    sysname          = N'$BATCH_APP';
          DECLARE @bchAppId   uniqueidentifier = N'$BATCH_APPID';
          DECLARE @apiSid     varbinary(16)    = CONVERT(varbinary(16), @apiAppId);
          DECLARE @bchSid     varbinary(16)    = CONVERT(varbinary(16), @bchAppId);

          -- If a user with the same name exists but with the wrong SID
          -- (e.g. previously created from objectId), drop it so we can
          -- recreate it with the correct appId-based SID.
          IF EXISTS (
              SELECT 1 FROM sys.database_principals
              WHERE name = @apiName AND sid <> @apiSid
          )
          BEGIN
              DECLARE @dropApi nvarchar(max) = N'DROP USER ' + QUOTENAME(@apiName);
              EXEC sp_executesql @dropApi;
          END;
          IF EXISTS (
              SELECT 1 FROM sys.database_principals
              WHERE name = @bchName AND sid <> @bchSid
          )
          BEGIN
              DECLARE @dropBch nvarchar(max) = N'DROP USER ' + QUOTENAME(@bchName);
              EXEC sp_executesql @dropBch;
          END;

          IF NOT EXISTS (SELECT 1 FROM sys.database_principals WHERE name = @apiName)
          BEGIN
              DECLARE @apiSql nvarchar(max) = N'CREATE USER ' + QUOTENAME(@apiName)
                  + N' WITH SID = ' + CONVERT(nvarchar(100), @apiSid, 1) + N', TYPE = E';
              EXEC sp_executesql @apiSql;
          END;

          IF NOT EXISTS (SELECT 1 FROM sys.database_principals WHERE name = @bchName)
          BEGIN
              DECLARE @bchSql nvarchar(max) = N'CREATE USER ' + QUOTENAME(@bchName)
                  + N' WITH SID = ' + CONVERT(nvarchar(100), @bchSid, 1) + N', TYPE = E';
              EXEC sp_executesql @bchSql;
          END;

          DECLARE @addRoleApiR  nvarchar(max) = N'ALTER ROLE db_datareader ADD MEMBER ' + QUOTENAME(@apiName);
          DECLARE @addRoleApiW  nvarchar(max) = N'ALTER ROLE db_datawriter ADD MEMBER ' + QUOTENAME(@apiName);
          DECLARE @addRoleBchR  nvarchar(max) = N'ALTER ROLE db_datareader ADD MEMBER ' + QUOTENAME(@bchName);
          DECLARE @addRoleBchW  nvarchar(max) = N'ALTER ROLE db_datawriter ADD MEMBER ' + QUOTENAME(@bchName);

          IF NOT EXISTS (SELECT 1 FROM sys.database_role_members rm
              JOIN sys.database_principals r ON rm.role_principal_id = r.principal_id
              JOIN sys.database_principals m ON rm.member_principal_id = m.principal_id
              WHERE r.name = N'db_datareader' AND m.name = @apiName) EXEC sp_executesql @addRoleApiR;
          IF NOT EXISTS (SELECT 1 FROM sys.database_role_members rm
              JOIN sys.database_principals r ON rm.role_principal_id = r.principal_id
              JOIN sys.database_principals m ON rm.member_principal_id = m.principal_id
              WHERE r.name = N'db_datawriter' AND m.name = @apiName) EXEC sp_executesql @addRoleApiW;
          IF NOT EXISTS (SELECT 1 FROM sys.database_role_members rm
              JOIN sys.database_principals r ON rm.role_principal_id = r.principal_id
              JOIN sys.database_principals m ON rm.member_principal_id = m.principal_id
              WHERE r.name = N'db_datareader' AND m.name = @bchName) EXEC sp_executesql @addRoleBchR;
          IF NOT EXISTS (SELECT 1 FROM sys.database_role_members rm
              JOIN sys.database_principals r ON rm.role_principal_id = r.principal_id
              JOIN sys.database_principals m ON rm.member_principal_id = m.principal_id
              WHERE r.name = N'db_datawriter' AND m.name = @bchName) EXEC sp_executesql @addRoleBchW;

          -- Grant EXECUTE on scalar functions / stored procs (e.g. dbo.fnToHiragana).
          -- db_datareader / db_datawriter alone do NOT include EXECUTE.
          DECLARE @grantApi nvarchar(max) = N'GRANT EXECUTE TO ' + QUOTENAME(@apiName);
          DECLARE @grantBch nvarchar(max) = N'GRANT EXECUTE TO ' + QUOTENAME(@bchName);
          EXEC sp_executesql @grantApi;
          EXEC sp_executesql @grantBch;
          SQL

          # Authenticate via the active az CLI session (the OIDC SP that
          # was just set as the SQL Entra admin in the previous step).
          $SQLCMD -S "$SQL_FQDN" -d "$SQL_DB" \
            --authentication-method ActiveDirectoryAzCli \
            -i /tmp/grant.sql -b

      - name: Build Backend
        if: env.RUN_BACKEND == 'true'
        run: dotnet build src/backend/ComiCal.slnx --configuration Release

      - name: Publish API Functions
        if: env.RUN_BACKEND == 'true'
        run: |
          dotnet publish src/backend/api/ComiCal.Api/ComiCal.Api.csproj \
            --configuration Release --output ./publish/api
          cd publish/api && zip -r ../../api.zip .

      - name: Publish Batch Functions
        if: env.RUN_BACKEND == 'true'
        run: |
          dotnet publish src/backend/batch/ComiCal.Batch/ComiCal.Batch.csproj \
            --configuration Release --output ./publish/batch
          cd publish/batch && zip -r ../../batch.zip .

      - name: Deploy API to Azure Functions
        if: env.RUN_BACKEND == 'true'
        run: |
          az functionapp deployment source config-zip \
            --resource-group "${{ steps.outputs.outputs.rg }}" \
            --name "${{ steps.outputs.outputs.apiApp }}" \
            --src api.zip

      - name: Deploy Batch to Azure Functions
        if: env.RUN_BACKEND == 'true'
        run: |
          az functionapp deployment source config-zip \
            --resource-group "${{ steps.outputs.outputs.rg }}" \
            --name "${{ steps.outputs.outputs.batchApp }}" \
            --src batch.zip

      - name: Build Frontend
        if: env.RUN_FRONTEND == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter frontend build
          cp src/frontend/dist/frontend/browser/index.csr.html src/frontend/dist/frontend/browser/index.html
          cp staticwebapp.config.json src/frontend/dist/frontend/browser/staticwebapp.config.json

      - name: Deploy Frontend to SWA
        if: env.RUN_FRONTEND == 'true'
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_DEPLOY_TOKEN }}
          action: upload
          app_location: src/frontend/dist/frontend/browser
          output_location: ""
          skip_app_build: true
