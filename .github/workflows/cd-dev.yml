name: CD (dev)

# Stage Z: dev は main への push で自動デプロイ。
# bicep what-if でガードしたうえで Bicep deploy → DACPAC publish →
# Functions API/Batch → SWA → smoke test の順で進む。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd-dev-${{ github.ref }}
  cancel-in-progress: false

env:
  AZURE_LOCATION: japaneast
  ENV_NAME: dev
  DOTNET_VERSION: '10.0.100'
  NODE_VERSION: '22'
  PNPM_VERSION: '9.15.4'
  BICEP_FILE: infra/main.bicep
  BICEP_PARAMS: infra/params/dev.bicepparam

jobs:
  # ---------------------------------------------------------------------
  # 1. Build all artifacts (frontend SSR / Functions API / Functions Batch / DACPAC)
  # ---------------------------------------------------------------------
  build:
    name: Build artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-dotnet@87b7050bc53ea08284295505d98d2aa94301e852 # v4.2.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter frontend build
      - run: dotnet publish src/backend/api/ComiCal.Api.csproj -c Release -o ./out/api
      - run: dotnet publish src/backend/batch/ComiCal.Batch.csproj -c Release -o ./out/batch
      - run: dotnet build src/db/ComiCal.Database.sqlproj -c Release
      - name: Stage DACPAC
        run: |
          mkdir -p out/db
          find src/db -type f -name '*.dacpac' -path '*/bin/Release/*' -exec cp {} out/db/ \;
          ls -la out/db
      - uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: dev-artifacts
          path: |
            src/frontend/dist
            out/api
            out/batch
            out/db
          if-no-files-found: error
          retention-days: 14

  # ---------------------------------------------------------------------
  # 2. Bicep what-if (ガード) — 実 deploy 前に差分を確認
  # ---------------------------------------------------------------------
  whatif:
    name: Bicep what-if (dev)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: dev
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: azure/login@a65d910e8af852a8061c627c456678983e180302 # v2.2.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: az deployment sub what-if
        uses: azure/cli@089eac9d8cc39f5d003e94f8b65efc51076c9cbd # v2.1.0
        env:
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
          SQL_AAD_ADMIN_OBJECT_ID: ${{ vars.SQL_AAD_ADMIN_OBJECT_ID }}
          SQL_AAD_ADMIN_LOGIN: ${{ vars.SQL_AAD_ADMIN_LOGIN }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        with:
          inlineScript: |
            az deployment sub what-if \
              -l "${AZURE_LOCATION}" \
              -f "${BICEP_FILE}" \
              -p "${BICEP_PARAMS}"

  # ---------------------------------------------------------------------
  # 3. Bicep deploy — リソース作成 / 更新。出力名で後続ジョブを駆動。
  # ---------------------------------------------------------------------
  deploy-bicep:
    name: Deploy Bicep (dev)
    needs: [build, whatif]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: dev
    outputs:
      resourceGroup: ${{ steps.deploy.outputs.resourceGroup }}
      staticWebApp: ${{ steps.deploy.outputs.staticWebApp }}
      functionAppApi: ${{ steps.deploy.outputs.functionAppApi }}
      functionAppBatch: ${{ steps.deploy.outputs.functionAppBatch }}
      sqlServer: ${{ steps.deploy.outputs.sqlServer }}
      sqlDatabase: ${{ steps.deploy.outputs.sqlDatabase }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: azure/login@a65d910e8af852a8061c627c456678983e180302 # v2.2.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - id: deploy
        name: az deployment sub create
        uses: azure/cli@089eac9d8cc39f5d003e94f8b65efc51076c9cbd # v2.1.0
        env:
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
          SQL_AAD_ADMIN_OBJECT_ID: ${{ vars.SQL_AAD_ADMIN_OBJECT_ID }}
          SQL_AAD_ADMIN_LOGIN: ${{ vars.SQL_AAD_ADMIN_LOGIN }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        with:
          inlineScript: |
            DEPLOY_NAME="cmcl-dev-$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::8}"
            az deployment sub create \
              -n "${DEPLOY_NAME}" \
              -l "${AZURE_LOCATION}" \
              -f "${BICEP_FILE}" \
              -p "${BICEP_PARAMS}" \
              --output json > deploy.json
            jq -r '.properties.outputs' deploy.json
            echo "resourceGroup=$(jq -r '.properties.outputs.resourceGroupName.value' deploy.json)"     >> "$GITHUB_OUTPUT"
            echo "staticWebApp=$(jq -r '.properties.outputs.staticWebAppName.value' deploy.json)"      >> "$GITHUB_OUTPUT"
            echo "functionAppApi=$(jq -r '.properties.outputs.functionAppApiName.value' deploy.json)"  >> "$GITHUB_OUTPUT"
            echo "functionAppBatch=$(jq -r '.properties.outputs.functionAppBatchName.value' deploy.json)" >> "$GITHUB_OUTPUT"
            echo "sqlServer=$(jq -r '.properties.outputs.sqlServerName.value' deploy.json)"            >> "$GITHUB_OUTPUT"
            echo "sqlDatabase=$(jq -r '.properties.outputs.sqlDatabaseName.value' deploy.json)"        >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------
  # 4. DACPAC publish (Pre/Post Deploy スクリプトは DACPAC が内部で実行)
  # ---------------------------------------------------------------------
  publish-dacpac:
    name: Publish DACPAC (dev)
    needs: [build, deploy-bicep]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: dev
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: dev-artifacts
      - uses: actions/setup-dotnet@87b7050bc53ea08284295505d98d2aa94301e852 # v4.2.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Install sqlpackage
        run: |
          dotnet tool install --global Microsoft.SqlPackage
          echo "${HOME}/.dotnet/tools" >> "${GITHUB_PATH}"
      - uses: azure/login@a65d910e8af852a8061c627c456678983e180302 # v2.2.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: SqlPackage /Action:Publish
        env:
          SQL_SERVER: ${{ needs.deploy-bicep.outputs.sqlServer }}
          SQL_DB: ${{ needs.deploy-bicep.outputs.sqlDatabase }}
        run: |
          set -euo pipefail
          DACPAC=$(ls out/db/*.dacpac | head -n1)
          test -n "${DACPAC}"
          ACCESS_TOKEN=$(az account get-access-token --resource https://database.windows.net/ --query accessToken -o tsv)
          sqlpackage \
            /Action:Publish \
            /SourceFile:"${DACPAC}" \
            /TargetServerName:"${SQL_SERVER}.database.windows.net" \
            /TargetDatabaseName:"${SQL_DB}" \
            /AccessToken:"${ACCESS_TOKEN}" \
            /p:BlockOnPossibleDataLoss=true \
            /p:DropObjectsNotInSource=false \
            /p:IncludeCompositeObjects=true

  # ---------------------------------------------------------------------
  # 5. Functions API
  # ---------------------------------------------------------------------
  deploy-functions-api:
    name: Deploy Functions API (dev)
    needs: [build, deploy-bicep]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: dev
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: dev-artifacts
      - uses: azure/login@a65d910e8af852a8061c627c456678983e180302 # v2.2.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: Azure/functions-action@fd80521afbba9a2a76a99ba1acc07aff8d733d11 # v1.5.2
        with:
          app-name: ${{ needs.deploy-bicep.outputs.functionAppApi }}
          package: ./out/api

  # ---------------------------------------------------------------------
  # 6. Functions Batch
  # ---------------------------------------------------------------------
  deploy-functions-batch:
    name: Deploy Functions Batch (dev)
    needs: [build, deploy-bicep]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: dev
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: dev-artifacts
      - uses: azure/login@a65d910e8af852a8061c627c456678983e180302 # v2.2.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: Azure/functions-action@fd80521afbba9a2a76a99ba1acc07aff8d733d11 # v1.5.2
        with:
          app-name: ${{ needs.deploy-bicep.outputs.functionAppBatch }}
          package: ./out/batch

  # ---------------------------------------------------------------------
  # 7. Static Web App (frontend SSR)
  # ---------------------------------------------------------------------
  deploy-swa:
    name: Deploy SWA (dev)
    needs: [build, deploy-bicep]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: dev
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: dev-artifacts
      - uses: azure/login@a65d910e8af852a8061c627c456678983e180302 # v2.2.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - id: token
        name: Resolve SWA deployment token
        env:
          RG: ${{ needs.deploy-bicep.outputs.resourceGroup }}
          SWA: ${{ needs.deploy-bicep.outputs.staticWebApp }}
        run: |
          TOKEN=$(az staticwebapp secrets list -g "${RG}" -n "${SWA}" --query 'properties.apiKey' -o tsv)
          echo "::add-mask::${TOKEN}"
          echo "swa_token=${TOKEN}" >> "$GITHUB_OUTPUT"
      - uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ steps.token.outputs.swa_token }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: 'src/frontend'
          output_location: 'dist/frontend/browser'
          skip_app_build: true
          deployment_environment: ''  # production slot for the dev SWA

  # ---------------------------------------------------------------------
  # 8. Smoke test (HTTP 200 + Japanese SSR sanity)
  # ---------------------------------------------------------------------
  smoke-test:
    name: Smoke test (dev)
    needs: [deploy-bicep, deploy-functions-api, deploy-swa, publish-dacpac, deploy-functions-batch]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: dev
    steps:
      - uses: azure/login@a65d910e8af852a8061c627c456678983e180302 # v2.2.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Resolve hostnames
        id: hosts
        env:
          RG: ${{ needs.deploy-bicep.outputs.resourceGroup }}
          SWA: ${{ needs.deploy-bicep.outputs.staticWebApp }}
        # `needs.deploy-bicep` is unavailable transitively; resolve with a direct lookup.
        run: |
          set -euo pipefail
          # Both hostnames are conventionally derivable, but query Azure to be safe.
          # SWA hostname is exposed via `defaultHostname`.
          : "${RG:?}"
          : "${SWA:?}"
          SWA_HOST=$(az staticwebapp show -g "${RG}" -n "${SWA}" --query 'defaultHostname' -o tsv)
          echo "swa_host=${SWA_HOST}" >> "$GITHUB_OUTPUT"
      - name: GET / (frontend SSR, must contain <html lang="ja">)
        run: |
          set -euo pipefail
          SWA_HOST="${{ steps.hosts.outputs.swa_host }}"
          BODY=$(curl -fsSL --retry 5 --retry-delay 6 --retry-all-errors "https://${SWA_HOST}/")
          echo "${BODY}" | head -n 5
          echo "${BODY}" | grep -q '<html[^>]*lang="ja"' \
            || { echo "::error::SSR response missing Japanese <html lang=\"ja\">"; exit 1; }
      - name: GET /api/health (Functions API via SWA-linked route)
        run: |
          set -euo pipefail
          SWA_HOST="${{ steps.hosts.outputs.swa_host }}"
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 6 --retry-all-errors "https://${SWA_HOST}/api/health")
          echo "status=${STATUS}"
          test "${STATUS}" = "200"
