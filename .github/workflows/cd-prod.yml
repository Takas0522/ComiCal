name: CD - Prod

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Deploy reason'
        required: true
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # Required for OIDC

jobs:
  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: prod
    concurrency:
      group: deploy-prod
      cancel-in-progress: false

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: '10'
          run_install: false

      - name: Azure Login (OIDC)
        uses: azure/login@532459ea530d8321f2fb9bb10d1e0bcf23869a43 # v3.0.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Bicep What-If
        env:
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
          RAKUTEN_APPLICATION_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          BATCH_OPERATOR_PRINCIPAL_ID: ${{ vars.BATCH_OPERATOR_PRINCIPAL_ID }}
          BATCH_OPERATOR_IP_ADDRESS: ${{ vars.BATCH_OPERATOR_IP_ADDRESS }}
        run: |
          az deployment sub what-if \
            --location japaneast \
            --template-file infra/main.bicep \
            --parameters infra/params/prod.bicepparam

      - name: Bicep Deploy
        env:
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
          RAKUTEN_APPLICATION_ID: ${{ secrets.RAKUTEN_APPLICATION_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          BATCH_OPERATOR_PRINCIPAL_ID: ${{ vars.BATCH_OPERATOR_PRINCIPAL_ID }}
          BATCH_OPERATOR_IP_ADDRESS: ${{ vars.BATCH_OPERATOR_IP_ADDRESS }}
        run: |
          az deployment sub create \
            --location japaneast \
            --template-file infra/main.bicep \
            --parameters infra/params/prod.bicepparam \
            --name "deploy-prod-${{ github.run_number }}"

      - name: Get deployment outputs
        id: outputs
        run: |
          DEPLOY_NAME="deploy-prod-${{ github.run_number }}"
          SQL_FQDN=$(az deployment sub show --name "$DEPLOY_NAME" --query "properties.outputs.sqlServerFqdn.value" -o tsv)
          SQL_DB=$(az deployment sub show --name "$DEPLOY_NAME" --query "properties.outputs.sqlDatabaseName.value" -o tsv)
          API_APP=$(az deployment sub show --name "$DEPLOY_NAME" --query "properties.outputs.funcApiName.value" -o tsv)
          STORAGE_ACCOUNT=$(az deployment sub show --name "$DEPLOY_NAME" --query "properties.outputs.storageAccountName.value" -o tsv)
          SWA_HOST=$(az deployment sub show --name "$DEPLOY_NAME" --query "properties.outputs.swaDefaultHostname.value" -o tsv)
          RG=$(az deployment sub show --name "$DEPLOY_NAME" --query "properties.outputs.resourceGroupName.value" -o tsv)
          {
            echo "sqlFqdn=$SQL_FQDN"
            echo "sqlDb=$SQL_DB"
            echo "apiApp=$API_APP"
            echo "storageAccount=$STORAGE_ACCOUNT"
            echo "swaHost=$SWA_HOST"
            echo "rg=$RG"
          } >> "$GITHUB_OUTPUT"

      - name: Validate production runtime prerequisites
        run: |
          set -euo pipefail
          RG='${{ steps.outputs.outputs.rg }}'
          API_APP='${{ steps.outputs.outputs.apiApp }}'
          STORAGE_ACCOUNT='${{ steps.outputs.outputs.storageAccount }}'
          SUBSCRIPTION_ID=$(az account show --query id -o tsv)

          # The API must not depend on a static egress IP any more (NAT Gateway was removed;
          # the Rakuten API is only called by the locally run batch — see ADR 0004).
          API_SUBNET=$(az resource show \
            --ids "/subscriptions/$SUBSCRIPTION_ID/resourceGroups/$RG/providers/Microsoft.Web/sites/$API_APP" \
            --api-version 2024-04-01 \
            --query properties.virtualNetworkSubnetId -o tsv)
          if [ -n "$API_SUBNET" ]; then
            echo "::warning::$API_APP is still VNet-integrated ($API_SUBNET). Run plan/scripts/apply-06-remove-network.ps1."
          fi

          STORAGE_ID=$(az storage account show \
            --resource-group "$RG" \
            --name "$STORAGE_ACCOUNT" \
            --query id -o tsv)
          PRINCIPAL_ID=$(az functionapp identity show \
            --resource-group "$RG" \
            --name "$API_APP" \
            --query principalId -o tsv)
          BLOB_ROLE_COUNT=$(az role assignment list \
            --assignee-object-id "$PRINCIPAL_ID" \
            --scope "$STORAGE_ID" \
            --query "[?roleDefinitionName=='Storage Blob Data Owner'] | length(@)" -o tsv)
          if [ "$BLOB_ROLE_COUNT" -lt 1 ]; then
            echo "::error::$API_APP is missing Storage Blob Data Owner on $STORAGE_ACCOUNT."
            exit 1
          fi

          for attempt in {1..18}; do
            STATUS=$(az rest --method get \
              --url "https://management.azure.com/subscriptions/$SUBSCRIPTION_ID/resourceGroups/$RG/providers/Microsoft.Web/sites/$API_APP/config/configreferences/appsettings/APPLICATIONINSIGHTS_CONNECTION_STRING?api-version=2024-04-01" \
              --query properties.status -o tsv 2>/dev/null || true)
            if [ "$STATUS" = "Resolved" ]; then
              break
            fi
            echo "Waiting for $API_APP/APPLICATIONINSIGHTS_CONNECTION_STRING Key Vault reference (status=${STATUS:-unknown}, attempt $attempt/18)."
            if [ "$attempt" -eq 18 ]; then
              echo "::error::The production Key Vault reference did not resolve."
              exit 1
            fi
            sleep 10
          done

      - name: Set SQL Server Entra admin
        # Idempotent. Required so the deploying SP can issue
        # CREATE USER FROM EXTERNAL PROVIDER against the database.
        run: |
          set -euo pipefail
          RG='${{ steps.outputs.outputs.rg }}'
          SQL_FQDN='${{ steps.outputs.outputs.sqlFqdn }}'
          SQL_SERVER="${SQL_FQDN%%.*}"
          az sql server ad-admin create \
            --resource-group "$RG" \
            --server "$SQL_SERVER" \
            --display-name 'comical-github-oidc' \
            --object-id '${{ vars.AZURE_CLIENT_OBJECT_ID }}' \
            -o none

      - name: DB Publish
        env:
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
        run: |
          dotnet tool install --global microsoft.sqlpackage || true
          dotnet build src/db/ComiCal.Database.sqlproj --configuration Release
          sqlpackage /Action:Publish \
            /SourceFile:"src/db/bin/Release/ComiCal.Database.dacpac" \
            /TargetServerName:"${{ steps.outputs.outputs.sqlFqdn }}" \
            /TargetDatabaseName:"${{ steps.outputs.outputs.sqlDb }}" \
            /TargetUser:"sqladmin" \
            /TargetPassword:"$SQL_ADMIN_PASSWORD" \
            /TargetEncryptConnection:True \
            /p:BlockOnPossibleDataLoss=true \
            /p:BackupDatabaseBeforeChanges=false

      - name: Grant DB access (API MI and local batch operator)
        # Idempotently CREATE USER (via SID) and grant db_datareader / db_datawriter /
        # EXECUTE to the API Function App MI and, when configured, to the maintainer who
        # runs the batch locally (vars.BATCH_OPERATOR_PRINCIPAL_ID, an Entra user object ID).
        env:
          BATCH_OPERATOR_PRINCIPAL_ID: ${{ vars.BATCH_OPERATOR_PRINCIPAL_ID }}
        run: |
          set -euo pipefail
          # Install go-sqlcmd (single static binary; uses az CLI session for AAD auth)
          curl -sSL -o /tmp/sqlcmd.tar.bz2 \
            https://github.com/microsoft/go-sqlcmd/releases/download/v1.8.0/sqlcmd-linux-amd64.tar.bz2
          mkdir -p /tmp/sqlcmd && tar -xjf /tmp/sqlcmd.tar.bz2 -C /tmp/sqlcmd
          SQLCMD=/tmp/sqlcmd/sqlcmd

          RG='${{ steps.outputs.outputs.rg }}'
          API_APP='${{ steps.outputs.outputs.apiApp }}'
          SQL_FQDN='${{ steps.outputs.outputs.sqlFqdn }}'
          SQL_DB='${{ steps.outputs.outputs.sqlDb }}'

          # For Service Principals (Managed Identity included), Azure SQL
          # expects the database user SID to be derived from the AAD
          # *application ID* (appId) — NOT the principal/object ID.
          # For Entra *users*, the SID is derived from the object ID.
          API_PID=$(az functionapp identity show -g "$RG" -n "$API_APP" --query principalId -o tsv)
          API_APPID=$(az ad sp show --id "$API_PID" --query appId -o tsv)
          if [ -z "$API_APPID" ]; then
            echo "Failed to resolve appId for the API Function App MI." >&2
            exit 1
          fi

          grant_sql() {
            local name="$1" guid="$2"
            cat <<SQL
          SET NOCOUNT ON;
          DECLARE @name sysname          = N'$name';
          DECLARE @id   uniqueidentifier = N'$guid';
          DECLARE @sid  varbinary(16)    = CONVERT(varbinary(16), @id);
          IF EXISTS (SELECT 1 FROM sys.database_principals WHERE name = @name AND sid <> @sid)
          BEGIN
              DECLARE @drop nvarchar(max) = N'DROP USER ' + QUOTENAME(@name);
              EXEC sp_executesql @drop;
          END;
          IF NOT EXISTS (SELECT 1 FROM sys.database_principals WHERE name = @name)
          BEGIN
              DECLARE @create nvarchar(max) = N'CREATE USER ' + QUOTENAME(@name)
                  + N' WITH SID = ' + CONVERT(nvarchar(100), @sid, 1) + N', TYPE = E';
              EXEC sp_executesql @create;
          END;
          IF ISNULL(IS_ROLEMEMBER(N'db_datareader', @name), 0) = 0
          BEGIN
              DECLARE @r nvarchar(max) = N'ALTER ROLE db_datareader ADD MEMBER ' + QUOTENAME(@name);
              EXEC sp_executesql @r;
          END;
          IF ISNULL(IS_ROLEMEMBER(N'db_datawriter', @name), 0) = 0
          BEGIN
              DECLARE @w nvarchar(max) = N'ALTER ROLE db_datawriter ADD MEMBER ' + QUOTENAME(@name);
              EXEC sp_executesql @w;
          END;
          -- db_datareader / db_datawriter alone do NOT include EXECUTE (e.g. dbo.fnToHiragana).
          DECLARE @x nvarchar(max) = N'GRANT EXECUTE TO ' + QUOTENAME(@name);
          EXEC sp_executesql @x;
          GO
          SQL
          }

          grant_sql "$API_APP" "$API_APPID" > /tmp/grant.sql
          if [ -n "${BATCH_OPERATOR_PRINCIPAL_ID:-}" ]; then
            grant_sql "comical-batch-operator" "$BATCH_OPERATOR_PRINCIPAL_ID" >> /tmp/grant.sql
          fi

          # Authenticate via the active az CLI session (the OIDC SP that
          # was just set as the SQL Entra admin in the previous step).
          $SQLCMD -S "$SQL_FQDN" -d "$SQL_DB" \
            --authentication-method ActiveDirectoryAzCli \
            -i /tmp/grant.sql -b

      - name: Build All
        run: |
          dotnet build src/backend/ComiCal.slnx --configuration Release
          pnpm install --frozen-lockfile
          pnpm --filter frontend build
          cp src/frontend/dist/frontend/browser/index.csr.html src/frontend/dist/frontend/browser/index.html
          cp staticwebapp.config.json src/frontend/dist/frontend/browser/staticwebapp.config.json

      # The batch (src/backend/batch) is not deployed to Azure; it runs locally via
      # tools/run-batch-local.ps1 (see ADR 0004).
      - name: Publish API Functions
        run: |
          dotnet publish src/backend/api/ComiCal.Api/ComiCal.Api.csproj -c Release -o ./publish/api
          cd publish/api && zip -r ../../api.zip . && cd ../..

      # NOTE: The Function App runs on Flex Consumption (FC1), which does not
      # support deployment slots. Deploy directly to the production app.
      - name: Deploy API to Azure Functions
        run: |
          az functionapp deployment source config-zip \
            --resource-group "${{ steps.outputs.outputs.rg }}" \
            --name "${{ steps.outputs.outputs.apiApp }}" \
            --src api.zip

      - name: Verify production Functions
        run: |
          set -euo pipefail
          RG='${{ steps.outputs.outputs.rg }}'
          API_APP='${{ steps.outputs.outputs.apiApp }}'

          for attempt in {1..20}; do
            API_COUNT=$(az functionapp function list -g "$RG" -n "$API_APP" --query 'length(@)' -o tsv)
            if [ "$API_COUNT" -eq 13 ]; then
              break
            fi
            echo "Waiting for Function indexing: API=$API_COUNT/13 (attempt $attempt/20)."
            if [ "$attempt" -eq 20 ]; then
              echo "::error::Production Functions were not indexed with the expected counts."
              exit 1
            fi
            sleep 15
          done

          SWA_HOST='${{ steps.outputs.outputs.swaHost }}'
          if [ -z "$SWA_HOST" ]; then
            echo "::error::The production Static Web App hostname was not returned by the deployment."
            exit 1
          fi
          check_status() {
            local path="$1"
            local expected="$2"
            local status
            for attempt in {1..12}; do
              status=$(curl --silent --show-error --output /dev/null \
                --write-out '%{http_code}' \
                --max-time 60 \
                "https://$SWA_HOST$path" || true)
              if [ "$status" = "$expected" ]; then
                return 0
              fi
              echo "Waiting for $path: HTTP $status, expected $expected (attempt $attempt/12)."
              sleep 10
            done
            echo "::error::$path returned HTTP $status; expected $expected."
            return 1
          }

          check_status '/api/v1/series?q=release-check' '200'
          check_status '/api/v1/volumes/upcoming' '200'
          check_status '/api/v1/admin/batch-runs' '401'

      - name: Deploy Frontend to SWA
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_DEPLOY_TOKEN }}
          action: upload
          app_location: src/frontend/dist/frontend/browser
          output_location: ""
          skip_app_build: true
