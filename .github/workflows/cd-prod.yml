name: CD - Prod

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Deploy reason'
        required: true
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write # Required for OIDC

jobs:
  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    environment: prod
    concurrency:
      group: deploy-prod
      cancel-in-progress: false

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@8d3c67de8e2fe68ef647c8db1e6a09f647780f40 # v2.19.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          global-json-file: global.json

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc

      - name: Setup pnpm
        uses: pnpm/action-setup@26f6d4f2c533a43e6b5da0b4a5dd983f98f7b49a # v6.0.4
        with:
          version: '10'
          run_install: false

      - name: Azure Login (OIDC)
        uses: azure/login@a457da9ea143d694b1b9c7c869ebb04ebe844ef5 # v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Bicep What-If
        env:
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
        run: |
          az deployment sub what-if \
            --location japaneast \
            --template-file infra/main.bicep \
            --parameters infra/params/prod.bicepparam

      - name: Bicep Deploy
        env:
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
        run: |
          az deployment sub create \
            --location japaneast \
            --template-file infra/main.bicep \
            --parameters infra/params/prod.bicepparam \
            --name "deploy-prod-${{ github.run_number }}"

      - name: Get deployment outputs
        id: outputs
        run: |
          DEPLOY_NAME="deploy-prod-${{ github.run_number }}"
          SQL_FQDN=$(az deployment sub show --name "$DEPLOY_NAME" --query "properties.outputs.sqlServerFqdn.value" -o tsv)
          SQL_DB=$(az deployment sub show --name "$DEPLOY_NAME" --query "properties.outputs.sqlDatabaseName.value" -o tsv)
          API_APP=$(az deployment sub show --name "$DEPLOY_NAME" --query "properties.outputs.funcApiName.value" -o tsv)
          BATCH_APP=$(az deployment sub show --name "$DEPLOY_NAME" --query "properties.outputs.funcBatchName.value" -o tsv)
          RG=$(az deployment sub show --name "$DEPLOY_NAME" --query "properties.outputs.resourceGroupName.value" -o tsv)
          echo "sqlFqdn=$SQL_FQDN" >> $GITHUB_OUTPUT
          echo "sqlDb=$SQL_DB" >> $GITHUB_OUTPUT
          echo "apiApp=$API_APP" >> $GITHUB_OUTPUT
          echo "batchApp=$BATCH_APP" >> $GITHUB_OUTPUT
          echo "rg=$RG" >> $GITHUB_OUTPUT

      - name: Set SQL Server Entra admin
        # Idempotent. Required so the deploying SP can issue
        # CREATE USER FROM EXTERNAL PROVIDER against the database.
        run: |
          set -euo pipefail
          RG='${{ steps.outputs.outputs.rg }}'
          SQL_FQDN='${{ steps.outputs.outputs.sqlFqdn }}'
          SQL_SERVER="${SQL_FQDN%%.*}"
          az sql server ad-admin create \
            --resource-group "$RG" \
            --server "$SQL_SERVER" \
            --display-name 'comical-github-oidc' \
            --object-id '${{ vars.AZURE_CLIENT_OBJECT_ID }}' \
            -o none

      - name: DB Publish
        env:
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
        run: |
          dotnet tool install --global microsoft.sqlpackage || true
          dotnet build src/db/ComiCal.Database.sqlproj --configuration Release
          sqlpackage /Action:Publish \
            /SourceFile:"src/db/bin/Release/ComiCal.Database.dacpac" \
            /TargetServerName:"${{ steps.outputs.outputs.sqlFqdn }}" \
            /TargetDatabaseName:"${{ steps.outputs.outputs.sqlDb }}" \
            /TargetUser:"sqladmin" \
            /TargetPassword:"$SQL_ADMIN_PASSWORD" \
            /TargetEncryptConnection:True \
            /p:BlockOnPossibleDataLoss=true \
            /p:BackupDatabaseBeforeChanges=false

      - name: Build All
        run: |
          dotnet build src/backend/ComiCal.slnx --configuration Release
          pnpm install --frozen-lockfile
          pnpm --filter frontend build
          cp src/frontend/dist/frontend/browser/index.csr.html src/frontend/dist/frontend/browser/index.html
          cp staticwebapp.config.json src/frontend/dist/frontend/browser/staticwebapp.config.json

      - name: Publish Functions
        run: |
          dotnet publish src/backend/api/ComiCal.Api/ComiCal.Api.csproj -c Release -o ./publish/api
          dotnet publish src/backend/batch/ComiCal.Batch/ComiCal.Batch.csproj -c Release -o ./publish/batch
          cd publish/api && zip -r ../../api.zip . && cd ../..
          cd publish/batch && zip -r ../../batch.zip . && cd ../..

      - name: Deploy API to Azure Functions (staging slot)
        run: |
          az functionapp deployment source config-zip \
            --resource-group "${{ steps.outputs.outputs.rg }}" \
            --name "${{ steps.outputs.outputs.apiApp }}" \
            --slot staging \
            --src api.zip

      - name: Deploy Batch to Azure Functions
        run: |
          az functionapp deployment source config-zip \
            --resource-group "${{ steps.outputs.outputs.rg }}" \
            --name "${{ steps.outputs.outputs.batchApp }}" \
            --src batch.zip

      - name: Swap staging → production slot
        run: |
          az functionapp deployment slot swap \
            --resource-group "${{ steps.outputs.outputs.rg }}" \
            --name "${{ steps.outputs.outputs.apiApp }}" \
            --slot staging \
            --target-slot production

      - name: Deploy Frontend to SWA
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_DEPLOY_TOKEN }}
          action: upload
          app_location: src/frontend/dist/frontend/browser
          output_location: ""
          skip_app_build: true
