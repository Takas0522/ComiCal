name: CD (prod)

# Stage Z: prod は workflow_dispatch（手動）または release 公開で起動。
# GitHub Environment `production` の保護ルール（必須レビュアー）と
# concurrency: production-deploy で同時実行を防ぐ。
# pre-check: 同 SHA で cd-dev.yml が成功していることを確認する。

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      sha:
        description: 'デプロイ対象の commit SHA (省略時は workflow を実行している ref の SHA)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  AZURE_LOCATION: japaneast
  ENV_NAME: prod
  DOTNET_VERSION: '10.0.100'
  NODE_VERSION: '22'
  PNPM_VERSION: '9.15.4'
  BICEP_FILE: infra/main.bicep
  BICEP_PARAMS: infra/params/prod.bicepparam

jobs:
  # ---------------------------------------------------------------------
  # 0. Pre-flight: 対応 SHA で cd-dev が成功しているか確認
  # ---------------------------------------------------------------------
  preflight:
    name: Preflight (require successful cd-dev)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - id: resolve
        name: Resolve target SHA
        env:
          INPUT_SHA: ${{ inputs.sha }}
          GITHUB_SHA_ENV: ${{ github.sha }}
        run: |
          SHA="${INPUT_SHA:-$GITHUB_SHA_ENV}"
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"
          echo "Target SHA: ${SHA}"
      - name: Verify cd-dev success for SHA
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const sha = '${{ steps.resolve.outputs.sha }}';
            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'cd-dev.yml',
              head_sha: sha,
              status: 'success',
              per_page: 5,
            });
            core.info(`cd-dev runs for ${sha}: ${data.total_count}`);
            if (data.total_count === 0) {
              core.setFailed(`cd-dev.yml has not succeeded for SHA ${sha}. ` +
                `Promote to prod is blocked until dev is verified.`);
            } else {
              core.info(`Latest successful run: ${data.workflow_runs[0].html_url}`);
            }

  # ---------------------------------------------------------------------
  # 1. Build (固定 SHA をチェックアウトして再ビルド — 完全な再現性)
  # ---------------------------------------------------------------------
  build:
    name: Build artifacts
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.preflight.outputs.sha }}
      - uses: actions/setup-dotnet@87b7050bc53ea08284295505d98d2aa94301e852 # v4.2.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - uses: pnpm/action-setup@fe02b34f77f8bc703788d5817da081398fad5dd2 # v4.0.0
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter frontend build
      - run: dotnet publish src/backend/api/ComiCal.Api.csproj -c Release -o ./out/api
      - run: dotnet publish src/backend/batch/ComiCal.Batch.csproj -c Release -o ./out/batch
      - run: dotnet build src/db/ComiCal.Database.sqlproj -c Release
      - name: Stage DACPAC
        run: |
          mkdir -p out/db
          find src/db -type f -name '*.dacpac' -path '*/bin/Release/*' -exec cp {} out/db/ \;
      - uses: actions/upload-artifact@6f51ac03b9356f520e9adb1b1b7802705f340c2b # v4.5.0
        with:
          name: prod-artifacts
          path: |
            src/frontend/dist
            out/api
            out/batch
            out/db
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------
  # 2. Bicep what-if (production 保護環境への入口 — 承認ゲート)
  # ---------------------------------------------------------------------
  whatif:
    name: Bicep what-if (prod)
    needs: [preflight, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.preflight.outputs.sha }}
      - uses: azure/login@a65d910e8af852a8061c627c456678983e180302 # v2.2.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/cli@089eac9d8cc39f5d003e94f8b65efc51076c9cbd # v2.1.0
        env:
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
          SQL_AAD_ADMIN_OBJECT_ID: ${{ vars.SQL_AAD_ADMIN_OBJECT_ID }}
          SQL_AAD_ADMIN_LOGIN: ${{ vars.SQL_AAD_ADMIN_LOGIN }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        with:
          inlineScript: |
            az deployment sub what-if \
              -l "${AZURE_LOCATION}" \
              -f "${BICEP_FILE}" \
              -p "${BICEP_PARAMS}"

  # ---------------------------------------------------------------------
  # 3. Bicep deploy (prod)
  # ---------------------------------------------------------------------
  deploy-bicep:
    name: Deploy Bicep (prod)
    needs: [preflight, build, whatif]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: production
    outputs:
      resourceGroup: ${{ steps.deploy.outputs.resourceGroup }}
      staticWebApp: ${{ steps.deploy.outputs.staticWebApp }}
      functionAppApi: ${{ steps.deploy.outputs.functionAppApi }}
      functionAppBatch: ${{ steps.deploy.outputs.functionAppBatch }}
      sqlServer: ${{ steps.deploy.outputs.sqlServer }}
      sqlDatabase: ${{ steps.deploy.outputs.sqlDatabase }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.preflight.outputs.sha }}
      - uses: azure/login@a65d910e8af852a8061c627c456678983e180302 # v2.2.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - id: deploy
        uses: azure/cli@089eac9d8cc39f5d003e94f8b65efc51076c9cbd # v2.1.0
        env:
          SQL_ADMIN_PASSWORD: ${{ secrets.SQL_ADMIN_PASSWORD }}
          SQL_AAD_ADMIN_OBJECT_ID: ${{ vars.SQL_AAD_ADMIN_OBJECT_ID }}
          SQL_AAD_ADMIN_LOGIN: ${{ vars.SQL_AAD_ADMIN_LOGIN }}
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        with:
          inlineScript: |
            DEPLOY_NAME="cmcl-prod-$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::8}"
            az deployment sub create \
              -n "${DEPLOY_NAME}" \
              -l "${AZURE_LOCATION}" \
              -f "${BICEP_FILE}" \
              -p "${BICEP_PARAMS}" \
              --output json > deploy.json
            echo "resourceGroup=$(jq -r '.properties.outputs.resourceGroupName.value' deploy.json)"     >> "$GITHUB_OUTPUT"
            echo "staticWebApp=$(jq -r '.properties.outputs.staticWebAppName.value' deploy.json)"      >> "$GITHUB_OUTPUT"
            echo "functionAppApi=$(jq -r '.properties.outputs.functionAppApiName.value' deploy.json)"  >> "$GITHUB_OUTPUT"
            echo "functionAppBatch=$(jq -r '.properties.outputs.functionAppBatchName.value' deploy.json)" >> "$GITHUB_OUTPUT"
            echo "sqlServer=$(jq -r '.properties.outputs.sqlServerName.value' deploy.json)"            >> "$GITHUB_OUTPUT"
            echo "sqlDatabase=$(jq -r '.properties.outputs.sqlDatabaseName.value' deploy.json)"        >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------
  # 4. DACPAC publish (prod) — DropObjectsNotInSource は false で安全に
  # ---------------------------------------------------------------------
  publish-dacpac:
    name: Publish DACPAC (prod)
    needs: [build, deploy-bicep]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: production
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: prod-artifacts
      - uses: actions/setup-dotnet@87b7050bc53ea08284295505d98d2aa94301e852 # v4.2.0
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Install sqlpackage
        run: |
          dotnet tool install --global Microsoft.SqlPackage
          echo "${HOME}/.dotnet/tools" >> "${GITHUB_PATH}"
      - uses: azure/login@a65d910e8af852a8061c627c456678983e180302 # v2.2.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: SqlPackage /Action:Publish
        env:
          SQL_SERVER: ${{ needs.deploy-bicep.outputs.sqlServer }}
          SQL_DB: ${{ needs.deploy-bicep.outputs.sqlDatabase }}
        run: |
          set -euo pipefail
          DACPAC=$(ls out/db/*.dacpac | head -n1)
          test -n "${DACPAC}"
          ACCESS_TOKEN=$(az account get-access-token --resource https://database.windows.net/ --query accessToken -o tsv)
          sqlpackage \
            /Action:Publish \
            /SourceFile:"${DACPAC}" \
            /TargetServerName:"${SQL_SERVER}.database.windows.net" \
            /TargetDatabaseName:"${SQL_DB}" \
            /AccessToken:"${ACCESS_TOKEN}" \
            /p:BlockOnPossibleDataLoss=true \
            /p:DropObjectsNotInSource=false \
            /p:IncludeCompositeObjects=true

  # ---------------------------------------------------------------------
  # 5. Functions API (prod) — slot 'staging' に上げてから swap
  # ---------------------------------------------------------------------
  deploy-functions-api:
    name: Deploy Functions API (prod, staging slot)
    needs: [build, deploy-bicep]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: production
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: prod-artifacts
      - uses: azure/login@a65d910e8af852a8061c627c456678983e180302 # v2.2.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: Azure/functions-action@fd80521afbba9a2a76a99ba1acc07aff8d733d11 # v1.5.2
        with:
          app-name: ${{ needs.deploy-bicep.outputs.functionAppApi }}
          slot-name: ${{ vars.FUNCTIONS_API_SLOT_PROD || 'production' }}
          package: ./out/api

  # ---------------------------------------------------------------------
  # 6. Functions Batch (prod)
  # ---------------------------------------------------------------------
  deploy-functions-batch:
    name: Deploy Functions Batch (prod)
    needs: [build, deploy-bicep]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: production
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: prod-artifacts
      - uses: azure/login@a65d910e8af852a8061c627c456678983e180302 # v2.2.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: Azure/functions-action@fd80521afbba9a2a76a99ba1acc07aff8d733d11 # v1.5.2
        with:
          app-name: ${{ needs.deploy-bicep.outputs.functionAppBatch }}
          package: ./out/batch

  # ---------------------------------------------------------------------
  # 7. SWA (prod)
  # ---------------------------------------------------------------------
  deploy-swa:
    name: Deploy SWA (prod)
    needs: [preflight, build, deploy-bicep]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.preflight.outputs.sha }}
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: prod-artifacts
      - uses: azure/login@a65d910e8af852a8061c627c456678983e180302 # v2.2.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - id: token
        env:
          RG: ${{ needs.deploy-bicep.outputs.resourceGroup }}
          SWA: ${{ needs.deploy-bicep.outputs.staticWebApp }}
        run: |
          TOKEN=$(az staticwebapp secrets list -g "${RG}" -n "${SWA}" --query 'properties.apiKey' -o tsv)
          echo "::add-mask::${TOKEN}"
          echo "swa_token=${TOKEN}" >> "$GITHUB_OUTPUT"
      - uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ steps.token.outputs.swa_token }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: 'src/frontend'
          output_location: 'dist/frontend/browser'
          skip_app_build: true
          deployment_environment: ''  # production slot

  # ---------------------------------------------------------------------
  # 8. Smoke test (prod)
  # ---------------------------------------------------------------------
  smoke-test:
    name: Smoke test (prod)
    needs: [deploy-bicep, deploy-functions-api, deploy-swa, publish-dacpac, deploy-functions-batch]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment: production
    steps:
      - uses: azure/login@a65d910e8af852a8061c627c456678983e180302 # v2.2.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - id: hosts
        env:
          RG: ${{ needs.deploy-bicep.outputs.resourceGroup }}
          SWA: ${{ needs.deploy-bicep.outputs.staticWebApp }}
        run: |
          set -euo pipefail
          SWA_HOST=$(az staticwebapp show -g "${RG}" -n "${SWA}" --query 'defaultHostname' -o tsv)
          echo "swa_host=${SWA_HOST}" >> "$GITHUB_OUTPUT"
      - name: GET / (frontend SSR)
        run: |
          set -euo pipefail
          BODY=$(curl -fsSL --retry 5 --retry-delay 6 --retry-all-errors "https://${{ steps.hosts.outputs.swa_host }}/")
          echo "${BODY}" | grep -q '<html[^>]*lang="ja"' \
            || { echo "::error::SSR response missing Japanese <html lang=\"ja\">"; exit 1; }
      - name: GET /api/health
        run: |
          set -euo pipefail
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' --retry 5 --retry-delay 6 --retry-all-errors \
            "https://${{ steps.hosts.outputs.swa_host }}/api/health")
          test "${STATUS}" = "200"

  # ---------------------------------------------------------------------
  # 9. Annotate Release (workflow_dispatch 経由のときに release を作成 / 注釈)
  # ---------------------------------------------------------------------
  annotate-release:
    name: Annotate GitHub Release
    needs: [preflight, smoke-test]
    if: success()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const sha = '${{ needs.preflight.outputs.sha }}';
            const eventName = context.eventName;
            const body = `Production deploy succeeded for \`${sha}\` at ${new Date().toISOString()}.`;
            if (eventName === 'release') {
              const tag = context.payload.release.tag_name;
              core.info(`Updating release ${tag} with deploy annotation.`);
              const existing = context.payload.release.body || '';
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: context.payload.release.id,
                body: `${existing}\n\n---\n${body}`,
              });
            } else {
              const tag = `prod-${new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19)}Z`;
              core.info(`Creating release ${tag} for manual prod deploy.`);
              await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                target_commitish: sha,
                name: tag,
                body,
                draft: false,
                prerelease: false,
              });
            }
